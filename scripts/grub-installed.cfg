set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep
terminal_output console

menuentry "AOS 1.0 Forest" {
    search --no-floppy --file --set=root /boot/kernel.bin
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.img
    boot
}
